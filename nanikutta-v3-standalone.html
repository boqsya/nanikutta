  <style>
:root{
  --bg:#FAF7F1;--ink:#22201D;--ink-soft:#55504A;--card:#FFFFFF;--line:#DCD5C9;--primary:#2E7D63;--primary-dark:#205C48;--danger:#B3391E;--dup-bg:#FFC24D;--dup-ink:#4A3300;
  --asa-bg:#FFE9D2;--asa-ink:#A85B12;--hiru-bg:#DCEFFB;--hiru-ink:#1673A8;--ban-bg:#E7E0F5;--ban-ink:#5A4197;--bento-bg:#E2F3D8;--bento-ink:#3E751F;
}
*{box-sizing:border-box}.hidden{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDGothic","Hiragino Maru Gothic ProN","Yu Gothic","Hiragino Sans",sans-serif;font-size:20px;line-height:1.6;padding-bottom:60px;overflow-x:hidden}
.app{max-width:640px;margin:0 auto;padding:20px 16px 40px}h1{font-size:30px;text-align:center;margin:8px 0 20px;color:var(--primary-dark)}h2{font-size:24px;margin:32px 0 12px;border-left:8px solid var(--primary);padding-left:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 3px 10px rgba(0,0,0,.06)}label{display:block;font-size:20px;font-weight:bold;margin:18px 0 8px}label:first-of-type{margin-top:0}
input[type="date"]{width:100%;max-width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;font-size:20px;padding:14px 10px;min-height:60px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.period-row,.toggle-row,.filter-row{display:flex;gap:10px}.period-btn,.toggle-btn{flex:1;min-height:64px;font-size:22px;font-weight:bold;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer}
.period-btn[data-period="朝"].active{background:var(--asa-bg);border-color:var(--asa-ink);color:var(--asa-ink)}.period-btn[data-period="昼"].active{background:var(--hiru-bg);border-color:var(--hiru-ink);color:var(--hiru-ink)}.period-btn[data-period="晩"].active{background:var(--ban-bg);border-color:var(--ban-ink);color:var(--ban-ink)}.period-btn[data-period="弁当"].active{background:var(--bento-bg);border-color:var(--bento-ink);color:var(--bento-ink)}
.toggle-btn::before{content:"○ "}.toggle-btn.active{background:#DCEEE6;border-color:var(--primary);color:var(--primary-dark)}.toggle-btn.active::before{content:"✔ "}
.dish-entry{margin-bottom:10px}.dish-main-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}.item-input{width:100%;font-size:22px;padding:14px;min-height:60px;border-radius:12px;border:2px solid var(--line);margin-bottom:0;background:#fff;color:var(--ink)}.item-input::placeholder{color:#A9A29A}
.comment-toggle{min-height:60px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink-soft);font-size:17px;font-weight:bold;white-space:nowrap;cursor:pointer}.comment-toggle::before{content:"○ "}.comment-toggle.active{background:#EAF5F0;border-color:var(--primary);color:var(--primary-dark)}.comment-toggle.active::before{content:"✔ "}.dish-comment-input{margin-top:8px;background:#FFFDF8;font-size:19px;min-height:54px}
.save-btn{width:100%;min-height:72px;font-size:26px;font-weight:bold;color:#fff;background:var(--primary);border:none;border-radius:16px;margin-top:12px;cursor:pointer}.save-btn:active{background:var(--primary-dark)}.save-btn:disabled{opacity:.7}.error-msg{color:var(--danger);font-size:20px;font-weight:bold;text-align:center;margin-top:10px;min-height:26px}
.storage-warn{background:#FDECEA;border:2px solid var(--danger);color:#7A2712;font-size:18px;font-weight:bold;border-radius:12px;padding:12px 16px;margin-bottom:16px;text-align:center}.record-list{margin-top:12px}.empty-msg{text-align:center;color:var(--ink-soft);font-size:20px;padding:20px}.filter-label{font-size:17px;color:var(--ink-soft);margin:0 0 6px}.filter-row{gap:8px;margin:0 0 14px}.filter-btn{flex:1;min-height:52px;font-size:19px;font-weight:bold;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink-soft);opacity:.5;cursor:pointer}.filter-btn.active{opacity:1}.filter-btn[data-period="朝"].active{background:var(--asa-bg);border-color:var(--asa-ink);color:var(--asa-ink)}.filter-btn[data-period="昼"].active{background:var(--hiru-bg);border-color:var(--hiru-ink);color:var(--hiru-ink)}.filter-btn[data-period="晩"].active{background:var(--ban-bg);border-color:var(--ban-ink);color:var(--ban-ink)}.filter-btn[data-period="弁当"].active{background:var(--bento-bg);border-color:var(--bento-ink);color:var(--bento-ink)}
.day-block{margin-bottom:2px}.more-btn{display:block;width:100%;min-height:54px;font-size:18px;font-weight:bold;color:var(--primary-dark);background:#fff;border:2px dashed var(--primary);border-radius:12px;margin:4px 0 18px;cursor:pointer}.record-card,.history-record{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.record-head,.history-date-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}.record-date,.history-date{font-size:21px;font-weight:bold}.record-actions{display:flex;align-items:center;gap:8px}.period-tag{font-size:18px;font-weight:bold;padding:4px 14px;border-radius:999px}.period-tag.朝{background:var(--asa-bg);color:var(--asa-ink)}.period-tag.昼{background:var(--hiru-bg);color:var(--hiru-ink)}.period-tag.晩{background:var(--ban-bg);color:var(--ban-ink)}.period-tag.弁当{background:var(--bento-bg);color:var(--bento-ink)}
.item-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}.dish-chip-group{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.chip{font-size:20px;padding:8px 14px;border-radius:10px;background:#F2EEE6;border:1px solid var(--line)}button.chip{color:inherit;font-family:inherit;line-height:inherit;cursor:pointer;text-align:left}button.chip:focus-visible{outline:3px solid var(--primary);outline-offset:2px}.chip.dup{background:var(--dup-bg);color:var(--dup-ink);border-color:#C88A00;font-weight:bold}.dup-badge{display:inline-block;font-size:15px;background:var(--dup-ink);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}.dish-inline-comment{font-size:16px;color:var(--ink-soft);max-width:240px;padding-left:4px}.record-comment{margin-top:10px;font-size:18px;color:var(--ink-soft);background:#F2EEE6;border-radius:10px;padding:8px 12px}.legacy-comment{opacity:.8}
.history-record{border-left:5px solid var(--primary)}.history-dish{font-size:24px;font-weight:bold;margin-top:4px}.history-comment{font-size:19px;color:var(--ink-soft);background:#F2EEE6;border-radius:10px;padding:8px 12px;margin-top:8px}.edit-btn,.del-btn{min-height:44px;font-size:17px;border-radius:10px;padding:0 12px;cursor:pointer}.edit-btn{font-weight:bold;color:var(--primary-dark);background:#EAF5F0;border:1px solid var(--primary)}.del-btn{color:var(--ink-soft);background:#fff;border:1px solid var(--line)}
.cancel-edit-link{display:block;text-align:center;margin-top:10px;font-size:18px;color:var(--primary-dark);background:none;border:none;text-decoration:underline;cursor:pointer}.danger-link{display:block;text-align:center;margin-top:32px;font-size:17px;color:var(--danger);background:none;border:none;text-decoration:underline;cursor:pointer}.history-panel{background:#EAF5F0;border:2px solid var(--primary);border-radius:14px;padding:14px;margin-bottom:14px;text-align:center}.history-title{font-size:22px;font-weight:bold;margin-bottom:10px}.back-btn,.tool-btn{min-height:52px;font-size:18px;font-weight:bold;color:var(--primary-dark);background:#fff;border:2px solid var(--primary);border-radius:12px;padding:8px 14px;cursor:pointer}
.data-tools{margin-top:34px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink-soft)}.data-tools summary{font-size:18px;font-weight:bold;cursor:pointer}.data-tools p{font-size:16px;margin:10px 0}.data-tool-buttons{display:flex;gap:10px}.data-tool-buttons .tool-btn{flex:1}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:var(--primary-dark);color:#fff;font-size:26px;font-weight:bold;padding:20px 36px;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s ease;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}.modal-box{background:#fff;border-radius:20px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}.modal-text{font-size:22px;font-weight:bold;margin-bottom:20px}.modal-btns{display:flex;gap:10px}.modal-btn{flex:1;min-height:60px;font-size:21px;font-weight:bold;border-radius:14px;cursor:pointer}.modal-btn.cancel{background:#fff;color:var(--ink-soft);border:2px solid var(--line)}.modal-btn.danger{background:var(--danger);color:#fff;border:none}
@media(max-width:480px){.app{padding-left:12px;padding-right:12px}.record-head{align-items:flex-start}.record-actions{flex-wrap:wrap;justify-content:flex-end}.period-row,.filter-row{gap:6px}.period-btn{min-width:0;font-size:20px}.data-tool-buttons{flex-direction:column}.dish-main-row{grid-template-columns:minmax(0,1fr) 96px}.comment-toggle{font-size:15px;padding:0 8px}}

/* V3 additions */
.select-input{appearance:auto;-webkit-appearance:menulist;background:#fff}.mini-note{font-size:15px;color:var(--ink-soft);margin-top:6px}.miso-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:start}.miso-input{margin:0}.rice-entry{margin-bottom:0}
@media(max-width:480px){.miso-row{grid-template-columns:1fr}.miso-row .toggle-btn{width:100%}.mini-note{font-size:14px}}

</style>
</head>
<body>
  <main class="app">
    <h1>なにっくった</h1>
    <div class="storage-warn hidden" id="storageWarn">⚠ この環境では記録を保存できません。ページを開いている間だけ記録が見られます（閉じると消えます）</div>

    <section class="card" id="inputCard">
      <label for="dateInput">日付</label>
      <input type="date" id="dateInput">

      <label>時間帯</label>
      <div class="period-row">
        <button type="button" class="period-btn" data-period="朝">朝</button>
        <button type="button" class="period-btn" data-period="昼">昼</button>
        <button type="button" class="period-btn" data-period="晩">晩</button>
        <button type="button" class="period-btn" data-period="弁当">弁当</button>
      </div>

      <label for="riceSelect">ごはん</label>
      <div class="dish-entry rice-entry">
        <div class="dish-main-row">
          <select id="riceSelect" class="item-input select-input">
            <option value="白ご飯" selected>白ご飯</option>
            <option value="おかゆ">おかゆ</option>
            <option value="チャーハン">チャーハン</option>
            <option value="赤飯">赤飯</option>
            <option value="おじや">おじや</option>
            <option value="オムライス">オムライス</option>
          </select>

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!deleteModal.classList.contains("hidden"))closeModal()});
dateInput.value=todayStr();updateDishVisibility();load();
window.NanikuttaV3=Object.freeze({normalizeDish,isMatch,validateRecords,getRecords:()=>records.map(r=>({...r,dishes:[...r.dishes],dishComments:[...r.dishComments]}))});

</script>
